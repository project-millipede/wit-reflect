[workspace]
members = [
    "crates/wit-reflect",
    "crates/wit-reflect-macros",
    "fixtures/session/owner",
    "fixtures/session/component",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/project-millipede/wit-reflect"
keywords = ["wit", "wasm", "component-model", "bindings", "codegen"]
categories = ["wasm", "development-tools"]
# The two library crates state `publish = true`; the fixtures inherit this.
publish = false

# Libraries declare compatible ranges; the committed Cargo.lock records the
# exact versions. An exact `=` requirement here would conflict with any consumer
# workspace that pins the same crate to another patch release.
[workspace.dependencies]
heck = "0.5"
inventory = "0.3"
proc-macro2 = "1"
quote = "1"
semver = "1"
syn = { version = "3", features = ["full"] }
thiserror = "2"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
wit-parser = "0.261"
wit-reflect = { version = "0.1.0", path = "crates/wit-reflect" }
# The two crates are released together, so the runtime names exactly its macros.
wit-reflect-macros = { version = "=0.1.0", path = "crates/wit-reflect-macros" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# An explicit `match` naming both outcomes of an `Option` or `Result` is kept
# where each arm is a real case of the operation.
single_match_else = "allow"
