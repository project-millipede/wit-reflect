[package]
name = "session-owner"
description = "Fixture: ordinary Rust types and operations exported through wit-reflect."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Every derive of this crate looks its fields up in this map.
[package.metadata.wit-reflect]
representations = "crate::Representations"

[dependencies]
# `representations` reads the setting above. `tasks` serves the `generate`
# binary; a library that only carries marks does not enable it.
wit-reflect = { workspace = true, features = ["representations", "tasks"] }

[lints]
workspace = true
