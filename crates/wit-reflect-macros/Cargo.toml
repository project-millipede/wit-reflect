[package]
name = "wit-reflect-macros"
description = "Derive macro for wit-reflect."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[features]
# Read the crate's representation map from its manifest. It brings a TOML
# parser, so a crate without such a setting does not enable it.
representations = ["dep:toml"]

[dependencies]
heck.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
toml = { workspace = true, optional = true }

[lints]
workspace = true
