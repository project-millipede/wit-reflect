[package]
name = "wit-reflect-macros"
description = "Procedural macros for wit-reflect: the WitType, WitResource and FromParts derives, the export, exports and named attributes, and the representations! and operation! macros. Depend on wit-reflect, which re-exports them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
publish = true

[lib]
proc-macro = true

[features]
# Read the crate's representation map from its manifest. It brings a TOML
# parser, so a crate without such a setting does not enable it.
representations = ["dep:toml"]

[dependencies]
heck.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
toml = { workspace = true, optional = true }

[lints]
workspace = true
