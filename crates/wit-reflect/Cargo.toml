[package]
name = "wit-reflect"
description = "Reflect ordinary Rust types into validated WIT packages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["derive"]
# Re-export `#[derive(WitType)]`. Disable it to use only manual implementations.
derive = ["dep:wit-reflect-macros"]

[dependencies]
# Identifier case conversions that generated forwarding shares with wit-bindgen.
heck.workspace = true
semver.workspace = true
thiserror.workspace = true
wit-reflect-macros = { workspace = true, optional = true }

[dev-dependencies]
# Independent WIT grammar for the rendering boundary test.
wit-parser.workspace = true

[lints]
workspace = true

# The fixtures are declared with the derive.
[[test]]
name = "type_reflection"
required-features = ["derive"]

[[test]]
name = "operations"
required-features = ["derive"]

[[test]]
name = "representation_rules"
required-features = ["derive"]

[[test]]
name = "unchanged_types"
required-features = ["derive"]
